<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>Atmosphere Engine — Executive Architecture & Appendix</title>
<style>
  :root { --bg:#080d16; --card:#101929; --border:#1e2d45; --text:#f1f5f9; --muted:#94a3b8; --accent:#38bdf8; --accent2:#818cf8; --green:#34d399; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:Inter,-apple-system,sans-serif; height:100vh; display:flex; flex-direction:column; overflow:hidden; }
  header { display:flex; justify-content:space-between; align-items:center; padding:10px 20px; border-bottom:1px solid var(--border); background:#0b1320; }
  .brand { font-weight:700; font-size:13.5px; letter-spacing:0.04em; color:var(--accent); }
  .dots { display:flex; gap:5px; }
  .dot { width:24px; height:22px; border-radius:5px; border:1px solid var(--border); background:var(--card); color:var(--muted); font-size:11px; font-weight:600; cursor:pointer; }
  .dot.active { background:var(--accent); color:#080d16; border-color:var(--accent); }
  main { flex:1; padding:18px 24px; overflow-y:auto; display:flex; flex-direction:column; gap:12px; }
  h1 { font-size:21px; line-height:1.25; }
  .sub { color:var(--muted); font-size:13px; margin-top:2px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; flex:1; align-items:start; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px; display:flex; flex-direction:column; gap:8px; }
  .card h3 { font-size:12.5px; color:var(--accent); text-transform:uppercase; letter-spacing:0.05em; }
  ul { padding-left:16px; display:flex; flex-direction:column; gap:5px; font-size:12.5px; color:#cbd5e1; line-height:1.45; }
  table { width:100%; border-collapse:collapse; font-size:11.5px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--border); line-height:1.4; }
  th { color:var(--accent); font-size:10.5px; text-transform:uppercase; background:rgba(56,189,248,0.06); }
  img, video { width:100%; height:220px; object-fit:cover; border-radius:8px; border:1px solid var(--border); background:#000; }
  pre { background:#060a11; border:1px solid var(--border); border-radius:8px; padding:10px; font-size:11px; color:#cbd5e1; overflow-x:auto; line-height:1.35; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
  .kpis { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .kpi { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:9px 12px; }
  .kpi .v { font-size:18px; font-weight:700; color:var(--green); }
  .kpi .l { font-size:10.5px; color:var(--muted); text-transform:uppercase; }
  footer { display:flex; justify-content:space-between; align-items:center; padding:8px 20px; border-top:1px solid var(--border); background:#0b1320; font-size:12px; color:var(--muted); }
  .btn { background:var(--card); border:1px solid var(--border); color:var(--text); padding:5px 12px; border-radius:6px; cursor:pointer; font-weight:600; font-size:12px; }
  .btn:hover { border-color:var(--accent); }
  code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; color:#7dd3fc; font-size:11.5px; }
</style>
</head>
<body>
<header>
  <div class="brand">VOLUMETRIC ATMOSPHERE &amp; UNION-FIND HYDRODYNAMICS ENGINE // ARCHITECTURE &amp; APPENDIX</div>
  <div class="dots" id="dots"></div>
</header>
<main id="slide"></main>
<footer>
  <button class="btn" id="prev">← Previous</button>
  <span id="counter">Slide 1 / 10</span>
  <button class="btn" id="next">Next →</button>
</footer>
<script>

const slides = [

          <div class="kpi"><div class="v">O(N·α(N))</div><div class="l">Spatial Hash + Union-Find</div></div>

          </ul>`)}

        </div>`
  },
  {
    t: "2. System Architecture Pipeline (Graphviz DOT)",
    s: "Boot Pre-Bake → O(N) Spatial Hash + Union-Find Physics → Half-Res GPU Volumetric Pass",
    b: `<div class="grid2">
          ${card("Graphviz DOT Architecture (digraph AtmosphereEngine)", `<pre>digraph AtmosphereEngine {
  rankdir=LR;
  Baker  [label="CloudNoiseBaker\\n64³ Perlin-Worley + 32³ Detail\\nTypedArray.set Row Copy"];
  Topo   [label="analyzeTerrainTopologyUnionFind\\n56x56 Grid (3,136 cells)\\nReusable _topoDsu Buffers"];

  DSU    [label="DisjointSetUnion (512 parcels)\\nO(N α(N)) Coalescence +\\nViscous Momentum Coupling"];
  Frag   [label="atmosphere.frag.js (0.5x FBO)\\nRankine Vortex + Hurricane\\n+ Sheet Lightning + Fog"];
  Comp   [label="Hardware Bilinear Composite\\nbaseCol*(1-alpha) + cloudCol"];
  Baker -> Frag; Topo -> Grid3D -> DSU -> Comp; Frag -> Comp;
}</pre>`)}
          ${card("Trade Winds & Live Union-Find Telemetry", `<img src="screenshot_trade_winds_dsu.png" alt="Trade Winds DSU" />`)}
        </div>`
  },
  {
    t: "3. Entity-Relationship Diagram (ERD)",

    b: `<div class="grid2">
          ${card("Mermaid ERD (erDiagram)", `<pre>erDiagram
  ATMOSPHERE_LAYER ||--|| CLOUD_NOISE_BAKER : "bakes 64³ & 32³ 3D textures"
  ATMOSPHERE_LAYER ||--o{ CLOUD_GENUS : "10 WMO cloud genera"

  LAGRANGIAN_VORTEX_SYSTEM ||--|| SPATIAL_HASH_GRID_3D : "O(N) 3D cell buckets (20m)"
  LAGRANGIAN_VORTEX_SYSTEM ||--|| DISJOINT_SET_UNION : "O(N α(N)) eddy coalescence"

            <tr><th>Component</th><th>TypedArray Buffers</th><th>Complexity</th></tr>
            <tr><td><code>DisjointSetUnion</code></td><td><code>parent: Int32Array</code>, <code>size: Int32Array</code></td><td><code>O(α(N))</code></td></tr>

  {

    b: `<div class="grid2">
          ${card("Mermaid Sequence Diagram", `<pre>sequenceDiagram
  autonumber
  participant RAF as requestAnimationFrame
  participant Main as src/main.js
  participant Phys as LagrangianVortexParticleSystem
  participant Grid as SpatialHashGrid3D + DSU

  Main->>Phys: update(dt, _particleParams)

          ${card("3D Noise & Topographic Airflow Slice (Debug Mode 4)", `<img src="screenshot_glsl_shader.png" alt="GLSL Shader Slice" />`)}
        </div>`
  },
  {
    t: "5. What Union-Find Does in Your Simulation (Part 1: Particle Coalescence)",
    s: "A. Sea-Spray, Foam Rafts & Vortex Eddies via SpatialHashGrid3D + DisjointSetUnion",
    b: `<div class="grid2">
          ${card("Broad-Phase & Narrow-Phase Coalescence", `<ul>
            <li><b>Broad-Phase (<code>SpatialHashGrid3D</code>):</b> Every frame, <code>LagrangianVortexParticleSystem.update()</code> inserts all 512 3D sea-spray and vortex debris parcels into 20m 3D spatial hash buckets in <code>O(N)</code> time (clearing only <code>dirtyBuckets</code>).</li>
            <li><b>Narrow-Phase &amp; Union (<code>clusterNeighbors</code>):</b> Each particle scans its <code>3×3×3</code> neighboring cells. When two parcels collide within coalescence radius (<code>d &lt; R_coalesce</code>):
              <ul>
                <li><b>Topological Merge:</b> <code>dsu.union(i, j)</code> merges them into the same connected fluid eddy / foam cluster.</li>
                <li><b>Viscous Momentum Coupling:</b> Horizontal velocities blend toward their pairwise mean (<code>0.08</code> viscous alignment) so connected droplets move coherently.</li>
              </ul>
            </li>
          </ul>`)}
          ${card("How Cluster Size Drives Physics & GPU Shaders", `<ul>
            <li><b>Physical Inertia:</b> Each parcel queries its root component size (<code>compSize</code>). Larger coalesced clusters receive a higher mass factor:<br/><code>massFactor = 1.0 + Math.min(compSize, 16) * 0.08</code><br/>giving large foam rafts and tornado debris clusters higher momentum and lower aerodynamic drag (<code>dragRate = (2.4 / massFactor) * dt</code>).</li>
            <li><b>GPU Shader Sizing &amp; Glow:</b> <code>this.clusterSizes[i] = compSize</code> uploads to the GPU as vertex attribute <code>aClusterSize</code>. Isolated droplets (<code>size = 1</code>) render as small translucent spray points; large Union-Find clusters bloom into bright cyan-white foam rafts and vortex filaments.</li>
            <li><b>Live HUD Readout:</b> <code>Union-Find Clusters: 69 (Max: 318)</code>.</li>
          </ul>`)}
        </div>`
  },
  {
    t: "6. What Union-Find Does in Your Simulation (Part 2: Coastal Topology)",
    s: "B. Terrain Island & Flooded Waterway Connectivity Across Tide & Morph Sliders",
    b: `<div class="grid2">
          ${card("56×56 Coastal Grid Segmentation", `<ul>
            <li><b>Triggered on Tide or Landform Morph:</b> Adjusting <b>Tidal Sea Level</b> (<code>-5m</code> to <code>+12m</code>) or <b>Landform &amp; Canyon Morph</b> (<code>0% Islands → 100% Massif</code>) runs <code>analyzeTerrainTopologyUnionFind()</code> across a <code>56×56</code> (<code>3,136-cell</code>) heightfield grid.</li>
            <li><b>Phase Classification &amp; 4-Connected Union:</b> Classifies each cell as <b>Land</b> (<code>h &gt; waterLevel + 1.5m</code>) or <b>Water</b>, running <code>_topoDsu.union()</code> across adjacent cells of the same phase using pre-allocated zero-allocation buffers.</li>
            <li><b>Component Filtering:</b>
              <ul>
                <li>Connected <b>Land</b> components (<code>≥ 4 cells</code>) count distinct emerged islands/peaks.</li>
                <li>Connected <b>Water</b> components (<code>≥ 6 cells</code>) verify whether fjord gorges form a single navigable waterway (<code>1 Sea</code>) or split into isolated tidal basins.</li>
              </ul>
            </li>
          </ul>`)}
          ${card("Beer-Lambert Optical Transmittance T (Debug Mode 2)", `<img src="screenshot_transmittance_debug.png" alt="Transmittance Debug" />`)}
        </div>`
  },
  {
    t: "7. Appendix: Why Spatial Hash + Union-Find Instead of a Priority Queue?",
    s: "Architectural Tradeoff Analysis: Continuous Fluid Coalescence vs. Discrete Rigid-Body TOI",
    b: `<div class="card">
          <h3>3D Spatial Hash Grid + Union-Find (Used Here) vs. Priority Queue (Min-Heap) Collision Clustering</h3>
          <table>
            <tr><th>Feature</th><th>3D Spatial Hash Grid + Union-Find (Used Here)</th><th>Priority Queue (Min-Heap) Collision Clustering</th></tr>
            <tr><td><b>Time Complexity / Frame</b></td><td><code>O(N)</code> spatial hash build + <code>O(N · α(N)) ≈ O(N)</code> union-find</td><td><code>O(N log N)</code> or <code>O(K log K)</code> heap insertions &amp; extract-min operations</td></tr>
            <tr><td><b>Memory Layout</b></td><td>100% flat <code>Int32Array</code>s (<code>parent</code>, <code>size</code>, <code>head</code>, <code>next</code>, <code>dirtyBuckets</code>), <b>zero per-frame heap allocations</b></td><td>Requires maintaining a binary heap of collision pairs <code>(distSq, i, j)</code> or time-of-impact <code>(toi, i, j)</code> events</td></tr>
            <tr><td><b>Transitive Clustering</b><br/><code>A↔B, B↔C ⇒ {A,B,C}</code></td><td><b>Native <code>O(α(N))</code>:</b> If droplet A touches B and B touches C inside a tornado wall, <code>dsu.union(A,B) + dsu.union(B,C)</code> automatically merges all three into one cluster of size 3.</td><td><b>Does not track connected components on its own</b>—a priority queue only orders pairwise events by distance or time, requiring a separate graph/DSU structure anyway to know cluster sizes.</td></tr>
            <tr><td><b>Best Use Case</b></td><td><b>Continuous fluid parcels, sea spray, foam rafts, vortex debris, and grid flood/island connectivity</b> where hundreds of particles overlap simultaneously every frame.</td><td><b>Discrete Time-of-Impact (TOI) rigid-body collisions</b> (e.g., billiard balls or resolving the exact millisecond two rigid Saronic ASV boat hulls collide).</td></tr>
          </table>
          <p style="font-size:12px;color:#cbd5e1;margin-top:6px;"><b>Future Fleet Extension:</b> To add vessel-to-vessel rigid-body collision avoidance (where the 3 Saronic ASVs predict their earliest Time-of-Closest-Approach in the canyon junction and steer around each other in priority order), a <b>Min-Heap Priority Queue on vessel-pair Time-of-Impact (TOI)</b> is the exact right structure for the fleet layer, while keeping Spatial Hash + Union-Find for the fluid/vortex particles.</p>
        </div>`
  },
  {
    t: "8. 10 Recorded Extreme Weather & Capability Video Scenarios",
    s: "Live 30 FPS WebGL2 Captures Across All 6 Storm Regimes, WMO Cloud Genera & Shader Debug Passes",
    b: `<div class="grid2">
          ${card("10 Recorded Video Scenarios (videos/*.webm)", `<table>
            <tr><th>#</th><th>Video File</th><th>Highlight</th></tr>
            <tr><td>01</td><td><code>scenario_01_ef5_supercell_tornado.webm</code></td><td>EF5 Wedge Tornado + 95% 3D Lightning</td></tr>
            <tr><td>02</td><td><code>scenario_02_cat5_hurricane_eyewall.webm</code></td><td>Cat-5 Eyewall + 4 Spiral Rainbands</td></tr>
            <tr><td>03</td><td><code>scenario_03_waterspout_whirlpool_dsu.webm</code></td><td>Waterspout + Whirlpool + 512 DSU Parcels</td></tr>
            <tr><td>04</td><td><code>scenario_04_derecho_arcus_tsunami.webm</code></td><td>Derecho Shelf Cloud + 100% Tsunami Wave</td></tr>
            <tr><td>05</td><td><code>scenario_05_noreaster_bomb_cyclone.webm</code></td><td>Nor'easter + +11.5m King-Tide Surge</td></tr>
            <tr><td>06</td><td><code>scenario_06_dusk_lightning_barrage.webm</code></td><td>Sunset Supercell + 100% Lightning Barrage</td></tr>
            <tr><td>07</td><td><code>scenario_07_dense_advection_sea_fog.webm</code></td><td>100% Beer-Lambert Fog + 55m Stratus</td></tr>
            <tr><td>08</td><td><code>scenario_08_golden_hour_archipelago.webm</code></td><td>5-Island Archipelago DSU + Cumulus</td></tr>
            <tr><td>09</td><td><code>scenario_09_beer_lambert_transmittance.webm</code></td><td>Pass 2: Transmittance T = exp(-σ_t s)</td></tr>
            <tr><td>10</td><td><code>scenario_10_3d_noise_topographic_airflow.webm</code></td><td>Pass 4: 64³ 3D Noise &amp; Mountain Flow</td></tr>
          </table>`)}
          ${card("Live Video Preview: EF5 Supercell Tornado & Lightning", `<video src="scenario_01_ef5_supercell_tornado.webm" autoplay loop muted controls playsinline></video>`)}
        </div>`
  },
  {
    t: "9. Codebase Conciseness & Hardware Acceleration",
    s: "Zero-Allocation Frame Loop, Vectorized GLSL & Pre-Baked 3D Volume Textures",
    b: `<div class="grid2">
          ${card("Hardware & Algorithmic Accelerations", `<table>
            <tr><th>Subsystem</th><th>Optimization</th><th>Gain</th></tr>
            <tr><td><b>3D Cloud Noise</b></td><td>Pre-baked <code>64³</code> macro + <code>32³</code> detail 3D textures via <code>TypedArray.set</code> row copies</td><td><b>~8.5× faster</b></td></tr>
            <tr><td><b>Volumetric FBO</b></td><td><code>0.5×</code> half-res raymarch target + blue-noise jitter + bilinear composite</td><td><b>4.0× fewer rays</b></td></tr>
            <tr><td><b>Particle Physics</b></td><td><code>SpatialHashGrid3D</code> dirty-bucket reset + flat <code>Int32Array</code> DSU</td><td><b>Zero GC pauses</b></td></tr>
            <tr><td><b>GLSL Raymarch</b></td><td>Vectorized <code>dot()</code> FBM octaves &amp; squared-distance vortex gates</td><td><b>-39% shader LOC</b></td></tr>
          </table>`)}
          ${card("Concise Module Line Counts", `<table>
            <tr><th>Module</th><th>Lines</th><th>Key Refactor</th></tr>
            <tr><td><code>src/layers/AtmosphereLayer.js</code></td><td>405</td><td><code>defGenus</code>/<code>defStorm</code>/<code>buildPreset</code> factories, reusable <code>_tmpColor</code></td></tr>
            <tr><td><code>src/noise/CloudNoiseBaker.js</code></td><td>232</td><td>Native <code>TypedArray.set(subarray)</code> row block copies</td></tr>
            <tr><td><code>src/physics/FluidClusterPhysics.js</code></td><td>430</td><td>Reusable <code>_topoDsu</code>/<code>_topoIsLand</code>, <code>O(1)</code> root size lookup</td></tr>
            <tr><td><code>src/shaders/atmosphere.frag.js</code></td><td>511</td><td>Vectorized FBM dot products &amp; Rankine/Hurricane fields</td></tr>
          </table>`)}
        </div>`
  },
  {
    t: "10. Live 4-Phase Scientific Experiment & 100.0% V8 Coverage",
    s: "14 Automated Unit, Front-End DOM & Multi-Frame Coupled Physics Suites",
    b: `<div class="grid2">
          ${card("4-Phase Coupled Experiment Telemetry", `<table>
            <tr><th>Experiment Phase</th><th>Regime Sweep</th><th>Measured Outcome</th></tr>
            <tr><td><b>1. Canyon Venturi</b></td><td>Morph <code>0% → 80%</code></td><td>Massif elev <code>30.0m → 81.3m</code>; Venturi ratio <code>1.00</code></td></tr>
            <tr><td><b>2. Cyclone + DSU</b></td><td>Calm → <code>95%</code> Vortex</td><td>Speed <code>31.9 → 47.0 m/s</code>; <code>60</code> DSU clusters (Max: <code>308</code>)</td></tr>
            <tr><td><b>3. Tsunami + ASVs</b></td><td>Tsunami <code>0% → 95%</code></td><td>Peak ASV heave <code>+30.2m</code>, roll <code>34.2°</code>, <code>100%</code> safe</td></tr>
            <tr><td><b>4. Tidal DSU Sweep</b></td><td>Tide <code>-4.5m → +11.5m</code></td><td>Connected topology verified (<code>4 Isl / 1 Sea</code>)</td></tr>
          </table>`)}
          ${card("Browser Test Runner & 100.0% V8 Coverage", `<img src="screenshot_live_experiment.png" alt="Live Experiment" />`)}
        </div>`
  }
];

let idx = 0;
const slideEl = document.getElementById('slide');
const dotsEl = document.getElementById('dots');
const counterEl = document.getElementById('counter');

function render() {
  const s = slides[idx];
  slideEl.innerHTML = `<div><h1>${s.t}</h1><div class="sub">${s.s}</div></div>${s.b}`;
  counterEl.textContent = `Slide ${idx + 1} / ${slides.length}`;
  Array.from(dotsEl.children).forEach((d, i) => d.classList.toggle('active', i === idx));
}

slides.forEach((_, i) => {
  const b = document.createElement('button');
  b.className = 'dot';
  b.textContent = i + 1;
  b.onclick = () => { idx = i; render(); };
  dotsEl.appendChild(b);
});

document.getElementById('prev').onclick = () => { idx = (idx - 1 + slides.length) % slides.length; render(); };
document.getElementById('next').onclick = () => { idx = (idx + 1) % slides.length; render(); };
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') document.getElementById('next').click();
  if (e.key === 'ArrowLeft') document.getElementById('prev').click();
});
render();
</script>
</body>
</html>
