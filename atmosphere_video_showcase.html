<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>10 Extreme Weather & Capability Scenario Videos</title>
<style>
  :root { --bg:#080d16; --card:#101929; --border:#1e2d45; --text:#f1f5f9; --muted:#94a3b8; --accent:#38bdf8; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:Inter,-apple-system,sans-serif; padding:14px; }
  .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; padding-bottom:10px; border-bottom:1px solid var(--border); }
  .top h1 { font-size:15px; color:var(--accent); letter-spacing:0.04em; text-transform:uppercase; }
  .top span { font-size:12px; color:var(--muted); font-family:ui-monospace,monospace; }
  .tabs { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
  .tab { background:var(--card); border:1px solid var(--border); color:var(--muted); padding:6px 10px; border-radius:6px; font-size:11.5px; cursor:pointer; font-weight:600; }
  .tab.active, .tab:hover { border-color:var(--accent); color:#fff; background:rgba(56,189,248,0.15); }
  .stage { display:grid; grid-template-columns:1.55fr 1fr; gap:14px; background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px; }
  video { width:100%; border-radius:8px; border:1px solid var(--border); background:#000; display:block; }
  .meta { display:flex; flex-direction:column; justify-content:space-between; gap:10px; }
  .meta h2 { font-size:16px; color:#fff; line-height:1.3; }
  .meta p { font-size:12.5px; color:var(--muted); line-height:1.5; }
  .badges { display:grid; grid-template-columns:1fr 1fr; gap:6px; font-family:ui-monospace,monospace; font-size:11px; }
  .badge { background:rgba(8,13,22,0.75); border:1px solid var(--border); border-radius:6px; padding:6px 8px; }
  .badge b { display:block; font-size:9.5px; color:var(--muted); text-transform:uppercase; }
  .badge span { color:var(--accent); font-weight:700; }
  .nav-row { display:flex; justify-content:space-between; gap:8px; }
  .nav-btn { flex:1; background:#1e293b; border:1px solid var(--border); color:#fff; padding:7px 10px; border-radius:6px; cursor:pointer; font-size:12px; font-weight:600; }
  .nav-btn:hover { border-color:var(--accent); }
</style>
</head>
<body>
<div class="top">
  <h1>Volumetric Atmosphere Engine — 10 Recorded Extreme Weather Scenarios</h1>
  <span id="counter">Scenario 01 / 10</span>
</div>
<div class="tabs" id="tabs"></div>
<div class="stage">
  <div>
    <video id="player" controls autoplay loop muted playsinline></video>
  </div>
  <div class="meta">
    <div>
      <h2 id="title"></h2>
      <p id="desc" style="margin-top:6px"></p>
    </div>
    <div class="badges" id="badges"></div>
    <div class="nav-row">
      <button class="nav-btn" id="prev">← Previous Scenario</button>
      <button class="nav-btn" id="next">Next Scenario →</button>
    </div>
  </div>
</div>

<script>
const videos = [
  { id:'01', file:'scenario_01_ef5_supercell_tornado.webm', short:'01 · EF5 Tornado', title:'01 · EF5 Supercell Wedge Tornado & Branched 3D Lightning', desc:'Massive Rankine wedge tornado vortex funnel coupled with towering Cumulonimbus thunderhead anvil, 95% 3D branched cloud-to-sea lightning bolts, and 36 m/s gale.', storm:'supercellTornado', genus:'Cumulonimbus (Cb)', vortex:'95% Tornado', wind:'36 m/s', bolts:'95% Bolts', fog:'25% Fog' },
  { id:'02', file:'scenario_02_cat5_hurricane_eyewall.webm', short:'02 · Cat-5 Hurricane', title:'02 · Category-5 Hurricane Eyewall & Spiral Rainbands', desc:'Tropical cyclone stadium eyewall with clear central eye, 4 logarithmic spiral rainbands, +4.5m storm surge, and 40 m/s cyclonic winds.', storm:'hurricane', genus:'Cumulonimbus (Cb)', vortex:'100% Eyewall', wind:'40 m/s', bolts:'90% Bolts', fog:'28% Fog' },
  { id:'03', file:'scenario_03_waterspout_whirlpool_dsu.webm', short:'03 · Waterspout + Whirlpool', title:'03 · Dual-Vortex Coupling: Maritime Waterspout + Whirlpool Maelstrom', desc:'Slender Rankine waterspout column coupled with a 100% abyssal whirlpool depression and 512 Union-Find DSU particles spiraling upward.', storm:'waterspout', genus:'Cumulonimbus (Cb)', vortex:'92% Spout / 100% Pool', wind:'28 m/s', bolts:'65% Bolts', fog:'18% Fog' },
  { id:'04', file:'scenario_04_derecho_arcus_tsunami.webm', short:'04 · Derecho + Tsunami', title:'04 · Derecho Squall Line Shelf Cloud & Giant Tsunami Soliton Wave', desc:'Bow-echo Derecho arcus roll cloud advancing above a 100% vertex-displaced Tsunami soliton wave lifting the 6-DOF Saronic ASV fleet.', storm:'derecho', genus:'Cumulonimbus (Cb)', vortex:'100% Tsunami Wave', wind:'36 m/s', bolts:'85% Bolts', fog:'22% Fog' },
  { id:'05', file:'scenario_05_noreaster_bomb_cyclone.webm', short:"05 · Nor'easter Flood", title:"05 · Nor'easter Bomb Cyclone & +11.5m King-Tide Canyon Surge", desc:'Baroclinic comma-head cyclone with Nimbostratus rain shield and +11.5m king-tide surge flooding the coastal canyon gorge.', storm:'norEaster', genus:'Nimbostratus (Ns)', vortex:'+11.5m King Tide', wind:'34 m/s', bolts:'70% Bolts', fog:'35% Fog' },
  { id:'06', file:'scenario_06_dusk_lightning_barrage.webm', short:'06 · Lightning Barrage', title:'06 · Golden-Dusk Supercell & 100% Branched 3D Lightning Barrage', desc:'Warm 22° sunset illumination combined with 100% continuous 3D branched GPU lightning bolts and volumetric sheet-lightning cloud flashes.', storm:'supercellTornado', genus:'Cumulonimbus (Cb)', vortex:'80% Tornado', wind:'32 m/s', bolts:'100% Barrage', fog:'20% Fog' },
  { id:'07', file:'scenario_07_dense_advection_sea_fog.webm', short:'07 · Dense Sea Fog', title:'07 · Heavy Beer-Lambert Advection Sea Fog & Low Stratus Deck', desc:'100% Beer-Lambert exponential atmospheric fog density beneath a low 55m Stratus cloud deck with autonomous vessels patrolling the fjord.', storm:'none', genus:'Stratus (St)', vortex:'Low 55m Ceiling', wind:'14 m/s', bolts:'0% Bolts', fog:'100% Dense Fog' },
  { id:'08', file:'scenario_08_golden_hour_archipelago.webm', short:'08 · Archipelago Cumulus', title:'08 · Trade-Winds Coastal Archipelago & Silver-Lining Cumulus', desc:'Detached Cumulus cauliflower towers with dual-lobe Henyey-Greenstein scattering and Powder effect over a low-tide (-4.0m) 5-island archipelago.', storm:'none', genus:'Cumulus (Cu)', vortex:'5 Isl / 1 Sea DSU', wind:'16 m/s', bolts:'0% Bolts', fog:'14% Haze' },
  { id:'09', file:'scenario_09_beer_lambert_transmittance.webm', short:'09 · Transmittance Map', title:'09 · Shader Pass 2: Beer-Lambert Optical Transmittance Heatmap', desc:'Live GPU shader debug view of optical transmittance T = exp(-σ_t · s), highlighting opaque tornado and thunderhead cores in coral.', storm:'supercellTornado', genus:'Debug Pass 2 (T)', vortex:'100% Tornado + Pool', wind:'34 m/s', bolts:'85% Bolts', fog:'22% Fog' },
  { id:'10', file:'scenario_10_3d_noise_topographic_airflow.webm', short:'10 · 3D Noise & Airflow', title:'10 · Shader Pass 4: 3D Perlin-Worley Noise & Topographic Airflow Slice', desc:'Cross-section of the 64³ 3D Perlin-Worley curl-noise atlas and 325m alpine massifs showing potential-flow deflection around mountain peaks.', storm:'hurricane', genus:'Debug Pass 4 (Noise)', vortex:'95% Hurricane', wind:'38 m/s', bolts:'50% Bolts', fog:'18% Fog' },
];

let cur = 0;
const tabsEl = document.getElementById('tabs');
const player = document.getElementById('player');
const titleEl = document.getElementById('title');
const descEl = document.getElementById('desc');
const badgesEl = document.getElementById('badges');
const counterEl = document.getElementById('counter');

function selectVideo(idx) {
  cur = (idx + videos.length) % videos.length;
  const v = videos[cur];
  player.src = v.file;
  player.play().catch(() => {});
  titleEl.textContent = v.title;
  descEl.textContent = v.desc;
  counterEl.textContent = `Scenario ${v.id} / 10 — ${v.file}`;
  badgesEl.innerHTML = [
    ['Storm Regime', v.storm],
    ['Cloud Genus / Mode', v.genus],
    ['Primary Feature', v.vortex],
    ['Wind Speed', v.wind],
    ['Lightning Intensity', v.bolts],
    ['Atmospheric Fog', v.fog],
  ].map(([k, val]) => `<div class="badge"><b>${k}</b><span>${val}</span></div>`).join('');
  Array.from(tabsEl.children).forEach((b, i) => b.classList.toggle('active', i === cur));
}

videos.forEach((v, i) => {
  const b = document.createElement('button');
  b.className = 'tab';
  b.textContent = v.short;
  b.onclick = () => selectVideo(i);
  tabsEl.appendChild(b);
});

document.getElementById('prev').onclick = () => selectVideo(cur - 1);
document.getElementById('next').onclick = () => selectVideo(cur + 1);
selectVideo(0);
</script>
</body>
</html>
